name: CI

# The gating build for every PR and every push to main. This is the status check that Dependabot
# auto-merge (.github/workflows/auto-dependabot.yml) waits on: a Dependabot PR lands only once this
# workflow is green. After the first push, add this workflow's `build` job as a REQUIRED status
# check in Settings → Branches → branch protection for `main`, so `--auto` merges have something to
# wait for.

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      # Verify gradle-wrapper.jar matches a known-good Gradle release checksum before it is
      # executed — guards against a tampered wrapper jar (a classic build-time backdoor).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build and test
        run: ./gradlew clean build test --stacktrace

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/**'
          if-no-files-found: ignore
